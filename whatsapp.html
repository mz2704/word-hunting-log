<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Hunting Field Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #16241C;
    --bg-alt: #1E3327;
    --bg-alt-2: #24392C;
    --paper: #EAE2CD;
    --paper-shadow: #d9cfb2;
    --ink: #1B2B22;
    --ink-soft: #4a5a4e;
    --brass: #C9A24B;
    --brass-soft: #a98a3f;
    --moss: #7fa084;
    --line: rgba(234, 226, 205, 0.14);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: #16241C;
    color: var(--paper);
    font-family: 'Space Grotesk', Arial, sans-serif;
    min-height: 100vh;
    padding: 56px 24px 80px;
  }

  .wrap { max-width: 920px; margin: 0 auto; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 20px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 28px;
    margin-bottom: 40px;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--moss);
    margin-bottom: 10px;
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: 42px;
    line-height: 1.05;
    color: var(--paper);
  }

  h1 em {
    font-style: italic;
    font-weight: 300;
    color: var(--brass);
  }

  .status {
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--moss);
    line-height: 1.6;
  }

  .status .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--moss);
    margin-right: 6px;
    animation: pulse 2s infinite ease-in-out;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .count-line {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--moss);
    margin-bottom: 24px;
    letter-spacing: 0.02em;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
  }

  .card {
    background: var(--paper);
    color: var(--ink);
    border-radius: 3px;
    padding: 22px 22px 18px;
    position: relative;
    box-shadow: 0 1px 0 var(--paper-shadow), 0 14px 30px -18px rgba(0,0,0,0.6);
    transform: rotate(var(--tilt, 0deg));
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    border: 1px solid rgba(27,43,34,0.08);
  }

  .card:hover {
    transform: rotate(0deg) translateY(-3px);
    box-shadow: 0 1px 0 var(--paper-shadow), 0 22px 34px -18px rgba(0,0,0,0.65);
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 22px;
    width: 34px; height: 10px;
    background: var(--brass);
    opacity: 0.85;
    clip-path: polygon(0 0, 100% 0, 90% 100%, 10% 100%);
  }

  .specimen-no {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--brass-soft);
    margin-bottom: 14px;
    margin-top: 6px;
  }

  .word {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 26px;
    line-height: 1.15;
    margin-bottom: 16px;
    word-break: break-word;
  }

  .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px dashed rgba(27,43,34,0.2);
    padding-top: 12px;
    font-size: 12px;
  }

  .sender {
    font-family: 'Space Grotesk', Arial, sans-serif;
    font-weight: 500;
    color: var(--ink);
    background: rgba(201, 162, 75, 0.22);
    padding: 3px 9px;
    border-radius: 20px;
  }

  .time {
    font-family: 'JetBrains Mono', monospace;
    color: var(--ink-soft);
    font-size: 11px;
  }

  .empty {
    text-align: center;
    padding: 100px 20px;
    color: var(--moss);
  }

  .empty .glyph {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-size: 22px;
    color: var(--paper);
    margin-bottom: 10px;
  }

  .empty p {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }

  .error-box {
    background: rgba(201, 90, 75, 0.12);
    border: 1px solid rgba(201, 90, 75, 0.35);
    color: #e8b4a8;
    padding: 16px 20px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
  }

  footer {
    text-align: center;
    margin-top: 60px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    opacity: 0.5;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="eyebrow">English Words Hunting</div>
        <h1>The Field <em>Log</em></h1>
      </div>
      <div class="status">
        <div><span class="dot"></span>Live</div>
        <div id="lastUpdated">-</div>
      </div>
    </header>

    <div class="count-line" id="countLine">Loading specimens...</div>

    <div id="content">
      <div class="empty">
        <div class="glyph">Fetching the log...</div>
        <p>Reading from the shared sheet</p>
      </div>
    </div>

    <footer>Auto-refreshes every 20 seconds</footer>
  </div>

<script>
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/1w5DDnvmtTb3KKW0VCWUJdvcx46hSZZ2SbpFhL_cly_Q/export?format=csv&gid=0';
  var REFRESH_MS = 20000;

  var contentEl = document.getElementById('content');
  var countEl = document.getElementById('countLine');
  var lastUpdatedEl = document.getElementById('lastUpdated');

  function parseCSV(text) {
    var rows = [];
    var row = [], field = '', inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i], next = text[i + 1];
      if (inQuotes) {
        if (c === '"' && next === '"') { field += '"'; i++; }
        else if (c === '"') { inQuotes = false; }
        else { field += c; }
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\n' || c === '\r') {
          if (field !== '' || row.length) { row.push(field); rows.push(row); row = []; field = ''; }
          if (c === '\r' && next === '\n') i++;
        } else { field += c; }
      }
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function render(rows) {
    if (!rows.length) {
      contentEl.innerHTML = '<div class="empty"><div class="glyph">The log is empty</div><p>No specimens collected yet - send a message starting with # in the group</p></div>';
      countEl.textContent = '0 specimens collected';
      return;
    }

    countEl.textContent = rows.length + (rows.length === 1 ? ' specimen collected' : ' specimens collected');

    var cardsHtml = rows.slice().reverse().map(function(r, idx) {
      var num = String(rows.length - idx).padStart(3, '0');
      var tilt = ((idx % 5) - 2) * 0.35;
      return '<div class="card" style="--tilt: ' + tilt + 'deg">' +
        '<div class="specimen-no">No. ' + num + '</div>' +
        '<div class="word">' + escapeHtml(r.word) + '</div>' +
        '<div class="meta">' +
          '<span class="sender">' + escapeHtml(r.sender) + '</span>' +
          '<span class="time">' + escapeHtml(r.time) + '</span>' +
        '</div>' +
      '</div>';
    }).join('');

    contentEl.innerHTML = '<div class="grid">' + cardsHtml + '</div>';
  }

  function loadData() {
    if (CSV_URL.indexOf('PASTE_YOUR') !== -1) {
      contentEl.innerHTML = '<div class="error-box">Not connected yet - replace CSV_URL near the top of the script with your published Google Sheet CSV link.</div>';
      countEl.textContent = '';
      return;
    }

    fetch(CSV_URL + (CSV_URL.indexOf('?') !== -1 ? '&' : '?') + 'cachebust=' + Date.now())
      .then(function(res) {
        if (!res.ok) throw new Error('Sheet returned status ' + res.status);
        return res.text();
      })
      .then(function(text) {
        var parsed = parseCSV(text).filter(function(r) {
          return r.length >= 3 && r[0] && r[0] !== 'Timestamp';
        });

        var rows = parsed.map(function(r) {
          return { time: r[0] || '', sender: r[1] || '', word: r[2] || '' };
        }).filter(function(r) { return r.word; });

        render(rows);
        lastUpdatedEl.textContent = 'Updated ' + new Date().toLocaleTimeString();
      })
      .catch(function(err) {
        contentEl.innerHTML = '<div class="error-box">Could not load the sheet.<br>' + escapeHtml(err.message) + '<br><br>Check that the sheet is published/shared publicly and CSV_URL is correct.</div>';
      });
  }

  loadData();
  setInterval(loadData, REFRESH_MS);
</script>
</body>
</html>
